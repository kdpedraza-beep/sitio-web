<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Heladería V.K - Productos</title>
    <link rel="stylesheet" href="CSS/productos.css">
</head>
<body>

    <header class="encabezado">
        <a href="index.html" class="volver">← Volver al inicio</a>
        <h1>Heladería V.K</h1>
    </header>

    <main>
        <h2 class="titulo-productos">Nuestros productos</h2>

        <section class="lista-productos">

            <article class="card">
                <img src="https://images.unsplash.com/photo-1560008581-09826d1de69e?w=400" alt="Helado de vainilla">
                <h3>Helado de vainilla</h3>
                <p class="precio">$3.500</p>
                <button type="button">Comprar</button>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1580915411954-282cb1b0d780?w=400" alt="Helado de chocolate">
                <h3>Helado de chocolate</h3>
                <p class="precio">$3.500</p>
                <button type="button">Comprar</button>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1488900128323-21503983a07e?w=400" alt="Helado de fresa">
                <h3>Helado de fresa</h3>
                <p class="precio">$3.800</p>
                <button type="button">Comprar</button>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1567206563064-6f60f40a2b57?w=400" alt="Copa de helado mixto">
                <h3>Copa mixta</h3>
                <p class="precio">$5.000</p>
                <button type="button">Comprar</button>
            </article>

        </section>
    </main>

</body>
</html>
