<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Heladería V.K - Formulario de compra</title>
    <link rel="stylesheet" href="CSS/formulario.css">
</head>
<body>

    <div class="encabezado">
        <a href="productos.html" id="volver-productos">← Volver a productos</a>
        <h1>Heladería V.K</h1>
    </div>

    <div id="contenedor-formulario">

        <h2>Completa tus datos para comprar</h2>

        <form>
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">
            </div>

            <div class="campo">
                <label for="celular">Número de celular</label>
                <input type="tel" id="celular" name="celular" placeholder="Escribe tu celular">
            </div>

            <div class="campo">
                <label for="direccion">Dirección de entrega</label>
                <input type="text" id="direccion" name="direccion" placeholder="Escribe tu dirección">
            </div>

            <button type="submit">Enviar pedido</button>
        </form>

    </div>

</body>
</html>
